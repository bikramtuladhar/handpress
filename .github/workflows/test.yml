name: test
on:
  push: { branches: [main] }
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npm test
      - name: the example site must be keyed and the demo in step with it
        run: |
          npm run keys
          npm run demo:build
          git diff --exit-code
